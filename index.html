<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ireen's To-Do List - Week 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Week 5: DOM Manipulation - Ireen Kathure</p>
    <form id="todo-form">
      <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off">
      <button id="add-btn" type="submit">Add Task</button>
    </form>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
